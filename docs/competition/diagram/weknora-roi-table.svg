<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="44" fill="white" font-size="16" font-weight="700">WeKnora 企业知识中枢 · 最终收益（货币化）</text>
  <text x="40" y="66" fill="#94a3b8" font-size="9">定性变化：重复问题从"问老员工"变成"问 AI"，答案带原文出处；排查经验沉淀进知识库可复用；全程审计日志。目前本人日常使用中，正推广至全组。</text>
  <text x="40" y="84" fill="#94a3b8" font-size="9">口径：时薪 = 月薪 ÷ 21.75 ÷ 8 × 1.4 ≈ 80 元/小时 · 金额四舍五入到百位 · 部门共 5 人，当前活跃用户 1 人，收益按本人实测样本计</text>

  <!-- Header row -->
  <rect x="40" y="104" width="1040" height="36" fill="rgba(6,78,59,0.45)"/>
  <line x1="40" y1="140" x2="1080" y2="140" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="52" y="128" fill="white" font-size="11" font-weight="600">项目</text>
  <text x="352" y="128" fill="white" font-size="11" font-weight="600">计算口径（可复核）</text>
  <text x="990" y="128" fill="white" font-size="11" font-weight="600" text-anchor="middle">结果（年化）</text>

  <!-- Row 1: 收益 -->
  <rect x="40" y="140" width="1040" height="56" fill="rgba(6,78,59,0.25)"/>
  <rect x="40" y="140" width="3" height="56" fill="#34d399"/>
  <text x="56" y="162" fill="white" font-size="11" font-weight="600">收益：文档/经验检索提效</text>
  <rect x="56" y="172" width="92" height="14" rx="7" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="0.75"/>
  <text x="102" y="182" fill="#34d399" font-size="7.5" text-anchor="middle">已发生 · 本人实测</text>
  <text x="352" y="172" fill="#cbd5e1" font-size="9.5">本人 × 每周约 10 次检索 × 每次节省 18 分钟（约 20 分钟 → 2 分钟）× 48 周 × 80 元/时</text>
  <text x="990" y="173" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">≈ 11,500 元</text>

  <!-- Row 2: 服务器 -->
  <rect x="40" y="196" width="1040" height="56" fill="rgba(30,41,59,0.35)"/>
  <rect x="40" y="196" width="3" height="56" fill="#64748b"/>
  <text x="56" y="218" fill="white" font-size="11" font-weight="600">成本：服务器</text>
  <rect x="56" y="228" width="34" height="14" rx="7" fill="rgba(30,41,59,0.6)" stroke="#64748b" stroke-width="0.75"/>
  <text x="73" y="238" fill="#94a3b8" font-size="7.5" text-anchor="middle">预估</text>
  <text x="352" y="228" fill="#cbd5e1" font-size="9.5">内网虚拟机边际成本为 0，按同规格云主机市价 300 元/月 × 12 就高计</text>
  <text x="990" y="229" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">3,600 元</text>

  <!-- Row 3: 模型 API -->
  <rect x="40" y="252" width="1040" height="56" fill="rgba(30,41,59,0.35)"/>
  <rect x="40" y="252" width="3" height="56" fill="#64748b"/>
  <text x="56" y="274" fill="white" font-size="11" font-weight="600">成本：模型 API 费用</text>
  <rect x="56" y="284" width="40" height="14" rx="7" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="0.75"/>
  <text x="76" y="294" fill="#34d399" font-size="7.5" text-anchor="middle">已发生</text>
  <text x="352" y="284" fill="#cbd5e1" font-size="9.5">Langfuse 统计月均 token × 模型牌价折算约 200 元/月 × 12（以平台账单为准）</text>
  <text x="990" y="285" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">2,400 元</text>

  <!-- Row 4: 二开人力 -->
  <rect x="40" y="308" width="1040" height="56" fill="rgba(30,41,59,0.35)"/>
  <rect x="40" y="308" width="3" height="56" fill="#64748b"/>
  <text x="56" y="330" fill="white" font-size="11" font-weight="600">成本：搭建与二开人力</text>
  <rect x="56" y="340" width="76" height="14" rx="7" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="0.75"/>
  <text x="94" y="350" fill="#34d399" font-size="7.5" text-anchor="middle">一次性 · 已发生</text>
  <text x="352" y="340" fill="#cbd5e1" font-size="9.5">部署调优 + 钉钉连接器 + 按人 API Key 约 8 人日 × 650 元/人日（git 提交记录可证）</text>
  <text x="990" y="341" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">5,200 元</text>

  <!-- Row 5: 净收益首年 -->
  <rect x="40" y="364" width="1040" height="56" fill="rgba(59,130,246,0.15)"/>
  <rect x="40" y="364" width="3" height="56" fill="#60a5fa"/>
  <text x="56" y="396" fill="white" font-size="11" font-weight="700">净收益（首年）</text>
  <text x="352" y="396" fill="#cbd5e1" font-size="9.5">收益 11,500 − 运行成本 6,000 − 一次性投入 5,200</text>
  <text x="990" y="397" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">≈ 0（当年打平）</text>

  <!-- Row 6: 净收益次年起 -->
  <rect x="40" y="420" width="1040" height="56" fill="rgba(59,130,246,0.15)"/>
  <rect x="40" y="420" width="3" height="56" fill="#60a5fa"/>
  <text x="56" y="452" fill="white" font-size="11" font-weight="700">净收益（次年起）</text>
  <text x="352" y="452" fill="#cbd5e1" font-size="9.5">收益 11,500 − 运行成本 6,000（不再含一次性投入）</text>
  <text x="990" y="453" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">≈ 5,500 元/年</text>

  <!-- Table grid lines -->
  <line x1="40" y1="196" x2="1080" y2="196" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="252" x2="1080" y2="252" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="308" x2="1080" y2="308" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="364" x2="1080" y2="364" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="420" x2="1080" y2="420" stroke="#1e293b" stroke-width="1"/>
  <line x1="340" y1="104" x2="340" y2="476" stroke="#1e293b" stroke-width="1"/>
  <line x1="900" y1="104" x2="900" y2="476" stroke="#1e293b" stroke-width="1"/>
  <rect x="40" y="104" width="1040" height="372" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Conclusion bar 1 -->
  <rect x="40" y="500" width="1040" height="32" rx="16" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="520" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="middle">结论：哪怕目前只有 1 人使用，年化提效 11,500 元已覆盖全部运行成本 6,000 元，一次性二开投入次年回本</text>

  <!-- Conclusion bar 2 -->
  <rect x="40" y="544" width="1040" height="32" rx="16" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="564" fill="#fbbf24" font-size="9.5" font-weight="600" text-anchor="middle">推广目标（预估）：同口径 × 5 人，年化提效 ≈ 5.8 万 − 运行成本 ≈ 1.6 万（模型费用按 5 倍估）→ 净收益 ≈ 4.2 万/年</text>
</svg>
